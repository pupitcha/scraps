<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,400;0,9..40,700;1,9..40,400;1,9..40,700&family=IBM+Plex+Sans+Thai:wght@400;500;700&family=Montserrat:wght@500&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E&#x270F;&#xFE0F;%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="180x180.png">

<style>
:root{--bg:#FBEFD6;--ink:#2D4DB5;--bar:#FBEFD6;--line:#CCD6F3;--acc:#8B162B}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bar);color:var(--ink);font:15px/1.5 'DM Sans','IBM Plex Sans Thai',system-ui,sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#bar{display:flex;gap:4px;align-items:center;background:var(--bar);border-bottom:1px solid var(--line);padding:6px;overflow-x:auto;flex:none}
button{font:500 13px/1.3 Montserrat,"IBM Plex Sans Thai",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:inherit;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button.on{background:var(--ink);color:var(--bar);border-color:var(--ink)}
#tools{display:flex;gap:4px;padding:6px;flex:none;align-items:center;background:var(--bar);border-bottom:1px solid var(--line)}
#tools .sp{flex:1}
#table{flex:1;position:relative;overflow:auto;touch-action:pan-x pan-y}
#canvas{position:relative;width:2400px;height:2400px}
.s{position:absolute;z-index:2;width:max-content;min-width:56px;max-width:260px;padding:9px 16px;border-radius:20px;box-shadow:0 1px 2px #0002,0 4px 12px #0000001a;touch-action:none;cursor:grab}
.s.drag{cursor:grabbing;box-shadow:0 10px 24px #0003;z-index:9999}
.s.tgt{outline:3px dashed var(--acc);outline-offset:3px}
.s .t{white-space:pre-wrap;word-break:break-word;outline:none;line-height:1.5;min-height:1.5em;user-select:text;caret-color:currentColor}
.s .t:empty:before{content:'Write\2026';opacity:.45}
.s .x{display:block;margin-top:4px;font:500 11px Montserrat,'IBM Plex Sans Thai',sans-serif;letter-spacing:.08em;text-transform:uppercase;opacity:.8;cursor:pointer}
.s.big{max-width:340px;border-radius:24px}.s.big .t{font-size:19px}
.grp{position:absolute;z-index:1;touch-action:none;cursor:grab}
.scr{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.scr .o{fill:none;stroke:var(--acc);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.scr .f{fill:var(--acc);opacity:.07}
.gn{font-family:Montserrat,'IBM Plex Sans Thai',sans-serif;font-weight:500;position:absolute;left:50%;top:-20px;transform:translateX(-50%);background:var(--bar);color:var(--acc);border:2px solid var(--acc);border-radius:99px;padding:3px 18px;font-size:19px;line-height:1.3;letter-spacing:.02em;white-space:nowrap;min-width:70px;text-align:center;outline:none;user-select:text;cursor:text}
.gn:empty:before{content:attr(data-ph);opacity:.5}
@media(max-width:700px),(max-height:500px) and (max-width:1000px){#canvas{width:100%!important}#table{overflow-x:hidden}.s{max-width:min(220px,calc(50vw - 24px))}.s.big{max-width:min(280px,calc(70vw - 24px))}#tools button,#bar button{padding:5px 10px}}
#fbar{position:fixed;left:50%;transform:translateX(-50%);z-index:10000;display:flex;gap:4px;align-items:center;background:var(--bar);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 8px;box-shadow:0 4px 14px #0003}
#fbar b{width:40px;height:34px;line-height:34px;text-align:center;font:700 16px 'DM Sans',sans-serif;border-radius:999px;cursor:pointer;user-select:none;-webkit-user-select:none}
#fbar b.on{background:var(--ink);color:var(--bar)}
#fbar hr{width:1px;height:22px;border:0;background:var(--line);margin:0 4px}
#login,dialog h3{font-weight:500;text-transform:uppercase;letter-spacing:.08em}
.t.b{font-weight:700}.t.i{font-style:italic}.t.u{text-decoration:underline}
dialog{font-family:Montserrat,"IBM Plex Sans Thai",sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);border-radius:18px;background:var(--bar);color:var(--ink);max-width:92vw;width:400px}
dialog::backdrop{background:#0003}
.lbl{font-size:11px;opacity:.75;margin:12px 0 6px}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick i{width:52px;height:68px;border-radius:10px;border:1px solid var(--line);cursor:pointer}
#ppal i{height:30px;width:62px;border-radius:999px}
.pick i.sel{box-shadow:0 0 0 2px var(--bar),0 0 0 4px var(--ink)}
#login{margin:auto;text-align:center;padding:2em}
.hide{display:none!important}
</style></head><body>
<div id="app" class="hide">
  <div id="bar"></div>
  <div id="tools">
    <button id="add">&#xFF0B; Scrap</button>
    <button id="undo">&#x21B6;</button>
    <button id="bin">&#x1F5D1; <span id="bn">0</span></button>
    <span class="sp"></span>
    <button id="menu">&#x2022;&#x2022;&#x2022;</button>
  </div>
  <div id="table"><div id="canvas"></div></div>
</div>
<div id="login" class="hide"><h2>Scraps</h2><p id="lmsg">Sign in to sync.</p><button id="gbtn">Sign in with Google</button></div>
<div id="fbar" class="hide"><b data-k="b">B</b><b data-k="i" style="font-style:italic">I</b><b data-k="u" style="text-decoration:underline">U</b><hr><b data-a="mix" title="New colours">&#x21BB;</b><b data-a="del" title="Move to bin">&#x2715;</b></div>
<dialog id="dlg"></dialog>
<script type="module">
import {firebaseConfig} from './config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,setDoc,updateDoc,deleteDoc,deleteField} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const $=s=>document.querySelector(s);
// ---- Look: 5 board backgrounds (redrawn as SVG/CSS so they stay sharp on any screen) + 5 colour palettes ----
const svgUrl=s=>`url("data:image/svg+xml,${encodeURIComponent(s)}")`;
const seeded=r=>()=>(r=(r*9301+49297)%233280)/233280;
const grain=(o,f)=>svgUrl(`<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='${f}' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .27 0 0 0 0 .23 0 0 0 ${o} 0'/></filter><rect width='240' height='240' filter='url(#n)'/></svg>`);
const WAVES=(()=>{const rnd=seeded(7);let d='';
  for(let i=0;i<6;i++){const x=20+i*40;let p=`M${x} 0`,lx=x;
    for(let y=48;y<=480;y+=48){const nx=y===480?x:x+(rnd()-.5)*7;p+=` Q${((lx+nx)/2+(rnd()-.5)*5).toFixed(1)} ${y-24} ${nx.toFixed(1)} ${y}`;lx=nx}
    d+=`<path d='${p}'/>`}
  return svgUrl(`<svg xmlns='http://www.w3.org/2000/svg' width='240' height='480'><g fill='none' stroke='#5B7FE0' stroke-width='1.7' stroke-linecap='round'>${d}</g></svg>`)})();
const STARS=(()=>{const rnd=seeded(11);let d='';
  [[60,90,17],[255,45,14],[165,235,15],[272,385,16],[72,470,15]].forEach(([cx,cy,R])=>{const rot=rnd()*6.28,pts=[];
    for(let k=0;k<10;k++){const a=rot+k*Math.PI/5,r=(k%2?R*.42:R)*(1+(rnd()-.5)*.18);pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}
    const P=p=>p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
    d+=`<polygon points='${P(pts)}' fill='#F4C430'/><polygon points='${P([[cx,cy],pts[9],pts[0],pts[1]])}' fill='#EE8B3A' opacity='.75'/>`});
  return svgUrl(`<svg xmlns='http://www.w3.org/2000/svg' width='320' height='560'>${d}</svg>`)})();
const BGS=[null,
  {n:'Grid',bar:'#FFE8EA',ink:'#8A3A48',line:'#F3C6CC',css:{backgroundColor:'#FFF1F1',backgroundImage:'linear-gradient(#F6C9CF 1px,transparent 1px),linear-gradient(90deg,#F6C9CF 1px,transparent 1px)',backgroundSize:'30px 30px',backgroundAttachment:'local'}},
  {n:'Lined',bar:'#FBFAF3',ink:'#1E4468',line:'#BCD3E6',css:{backgroundColor:'#FFFFFB',backgroundImage:'linear-gradient(90deg,transparent 58px,#B2344A 58px,#B2344A 59.5px,transparent 59.5px),repeating-linear-gradient(transparent 0 35px,#6FA3CF 35px 36px)',backgroundSize:'auto',backgroundAttachment:'local'}},
  {n:'Waves',bar:'#FBEFD6',ink:'#2D4DB5',line:'#CCD6F3',css:{backgroundColor:'#FDF6E6',backgroundImage:WAVES,backgroundSize:'240px 480px',backgroundAttachment:'local'}},
  {n:'Folded',bar:'#E7E4DF',ink:'#3B3733',line:'#D3CEC6',css:{backgroundColor:'#EDEBE7',
    backgroundImage:`linear-gradient(90deg,transparent 48.6%,#00000009 49.3%,#00000014 49.55%,#ffffffb0 49.7%,#00000008 50.3%,transparent 51%),linear-gradient(180deg,transparent 49.6%,#0000000d 50.4%,#ffffffa0 50.55%,#00000009 51.1%,transparent 52%),radial-gradient(ellipse at 28% 22%,#ffffff70,transparent 60%),radial-gradient(ellipse at 78% 82%,#0000000c,transparent 60%),${grain(.16,.9)}`,
    backgroundSize:'100% 100%,100% 100%,100% 100%,100% 100%,240px 240px',backgroundAttachment:'scroll'}},
  {n:'Stars',bar:'#E9E4DB',ink:'#5A4726',line:'#D6CDBE',css:{backgroundColor:'#EEEAE3',backgroundImage:`${STARS},${grain(.22,.6)}`,backgroundSize:'320px 560px,240px 240px',backgroundAttachment:'local'}}];
const PALS=[null,
  {c:['#F4ECC2','#A32857','#840016','#A5B8D4','#D8CCBB'],a:'#840016'},
  {c:['#EDCCCC','#B1CCC8','#A10808','#FCFCDC'],a:'#A10808'},
  {c:['#8B162B','#F9B6B8','#F6F3CF','#C6B63B','#F37521','#BAD2E8'],a:'#8B162B'},
  {c:['#E3DFCE','#94B1C8','#4C050C','#1A0905'],a:'#4C050C'},
  {c:['#775537','#FBE29D','#C0DDDA','#F1F1F1'],a:'#775537'}];
const NEUT=['#1C1C1C','#FFFFFF','#8C8C8C'];
// scrap colours: every (badge, text) pair from the palette (+ black/white/gray text) that passes WCAG AA contrast 4.5:1
const lum=h=>{const v=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(c=>c<=.03928?c/12.92:((c+.055)/1.055)**2.4);return .2126*v[0]+.7152*v[1]+.0722*v[2]};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const PAIRS={};
const pairs=p=>PAIRS[p]??=(()=>{const P=PALS[p].c,o=[];P.forEach(bg=>[...P,...NEUT].forEach(fg=>{if(fg!==bg&&contrast(bg,fg)>=4.5)o.push([bg,fg])}));return o})();
const hash=s=>[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
const combo=(id,s)=>{const P=pairs(B()?.pal||3);return P[((s.r??hash(id))>>>0)%P.length]};
const paint=(d,id,s)=>{const[bg,fg]=combo(id,s);d.style.background=bg;d.style.color=fg};
const rand32=()=>Math.random()*4294967295>>>0;
function theme(b){const g=BGS[b.bg||3],st=document.documentElement.style;
  st.setProperty('--bar',g.bar);st.setProperty('--bg',g.bar);st.setProperty('--ink',g.ink);st.setProperty('--line',g.line);st.setProperty('--acc',PALS[b.pal||3].a);
  const tb=$('#table');tb.style.background='';Object.assign(tb.style,g.css);
  document.querySelector('meta[name=theme-color]').content=g.bar}
// hand-drawn loop around a group: rounded-rect-ish ellipse, jittered, overshooting its start like a pen stroke
function scribble(w,h,seed){const rnd=seeded(seed%233280),cx=w/2,cy=h/2,a=w/2-4,b=h/2-4,N=24,st=rnd()*6.28,pts=[];
  for(let i=0;i<=N+3;i++){const t=st+i/N*Math.PI*2,c=Math.cos(t),s=Math.sin(t),j=(rnd()-.5)*5;
    pts.push([cx+(a+j)*Math.sign(c)*Math.abs(c)**.7,cy+(b+j)*Math.sign(s)*Math.abs(s)**.7])}
  const f=n=>n.toFixed(1);let d=`M${f(pts[0][0])} ${f(pts[0][1])}`;
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=` C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`}
  return d}
const uid8=()=>Math.random().toString(36).slice(2,10);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
let user,boards={},cur=localStorage.cur,showBin=false,unsub,history=[],dragging=false;

$('#gbtn').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$('#lmsg').textContent=e.message);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!dragging&&user&&B())render()},200)});
onAuthStateChanged(auth,u=>{
  user=u;$('#login').classList.toggle('hide',!!u);$('#app').classList.toggle('hide',!u);
  unsub&&unsub();if(!u)return;
  unsub=onSnapshot(collection(db,'users',u.uid,'boards'),async snap=>{
    boards={};snap.forEach(d=>boards[d.id]={id:d.id,...d.data()});
    if(!Object.keys(boards).length){await newBoard('Board 1');return}
    if(!boards[cur])cur=sortedBoards()[0].id;
    if(!dragging)render();
  });
});
const ref=id=>doc(db,'users',user.uid,'boards',id);
const sortedBoards=()=>Object.values(boards).sort((a,b)=>(a.order||0)-(b.order||0));
async function newBoard(name){const id=uid8();cur=id;await setDoc(ref(id),{name,order:Date.now(),bg:3,pal:3,scraps:{}})}
const B=()=>boards[cur];
// write scraps (one undo entry per commit); s=null deletes permanently. Groups with <2 live members dissolve.
function commit(list,undo=true){
  const b=B();b.groups??={};
  if(undo)history.push({b:cur,ops:list.map(([id])=>({id,prev:b.scraps[id]||null}))});
  const upd={},now=Date.now();
  // write only the fields that changed, so edits from another device to other fields are never overwritten
  const diff=(id,p,s)=>{
    if(!s){upd['scraps.'+id]=deleteField();return}
    if(!p){upd['scraps.'+id]={...s,ts:now};return}
    const full=upd['scraps.'+id];
    new Set([...Object.keys(p),...Object.keys(s)]).forEach(k=>{if(k==='ts'||p[k]===s[k])return;
      if(full)full[k]=s[k];else upd[`scraps.${id}.${k}`]=s[k]===undefined?deleteField():s[k]});
    if(!full)upd[`scraps.${id}.ts`]=now};
  list.forEach(([id,s])=>{const p=b.scraps[id];b.scraps[id]=s||undefined;diff(id,p,s)});
  const n={};Object.values(b.scraps).forEach(s=>s&&s.g&&!s.bin&&(n[s.g]=(n[s.g]||0)+1));
  Object.keys(b.groups).forEach(g=>{if(n[g]>=2)return;delete b.groups[g];upd['groups.'+g]=deleteField();
    Object.entries(b.scraps).forEach(([id,s])=>{if(s&&s.g===g){const p=s;b.scraps[id]={...s,g:null};diff(id,p,b.scraps[id])}})});
  updateDoc(ref(cur),upd);
}
const put=(id,s,undo=true)=>commit([[id,s]],undo);
const gOf=(b,s)=>s&&s.g&&!s.bin&&b.groups?.[s.g]?s.g:null;
let PAD=40;
const cvEl=id=>$('#canvas').querySelector(`[data-id="${id}"]`);
const editing=()=>!!document.activeElement?.closest?.('.t,.gn');
// Rich text: notes keep an HTML copy (s.h) limited to <b> <i> <u> <br>; s.t stays the plain text.
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const t2h=t=>esc(t||'').replace(/\n/g,'<br>');
const hOf=s=>s.h!=null?s.h:t2h(s.t);
function ser(root){ // DOM -> sanitized html
  let o='';
  const walk=(n,st)=>{
    if(n.nodeType===3){o+=esc(n.nodeValue);return}
    if(n.nodeType!==1)return;
    const tg=n.tagName.toLowerCase(),sy=n.style||{};
    if(tg==='br'){o+='<br>';return}
    const blk=tg==='div'||tg==='p';
    if(blk&&o&&!o.endsWith('<br>'))o+='<br>';
    const tags=[];
    if(tg==='b'||tg==='strong'||+sy.fontWeight>=600||sy.fontWeight==='bold')tags.push('b');
    if(tg==='i'||tg==='em'||sy.fontStyle==='italic')tags.push('i');
    if(tg==='u'||(sy.textDecoration||sy.textDecorationLine||'').includes('underline'))tags.push('u');
    tags.forEach(x=>o+='<'+x+'>');n.childNodes.forEach(c=>walk(c));tags.reverse().forEach(x=>o+='</'+x+'>');
  };
  root.childNodes.forEach(c=>walk(c));
  o=o.replace(/<(b|i|u)><\/\1>/g,'');
  const div=document.createElement('div');div.innerHTML=o;
  return{h:o,t:div.innerHTML.replace(/<br>/g,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')};
}
const clean=h=>{const d=document.createElement('div');d.innerHTML=h;return ser(d).h};

// floating B/I/U bar: sits just above the keyboard while a scrap is being edited; formats only the selected text
const fbar=$('#fbar');let saveCur=null;
const CMD={b:'bold',i:'italic',u:'underline'};
function fbarPlace(){const v=window.visualViewport;if(!v||fbar.classList.contains('hide'))return;
  fbar.style.top=(v.offsetTop+v.height-fbar.offsetHeight-10)+'px'}
function fbarState(){fbar.querySelectorAll('b').forEach(b=>b.classList.toggle('on',document.queryCommandState(CMD[b.dataset.k])))}
document.addEventListener('focusin',e=>{const t=e.target.closest?.('.t');
  if(t&&t.isContentEditable){fbar.classList.remove('hide');fbarPlace();fbarState()}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!document.activeElement?.closest?.('.t'))fbar.classList.add('hide')},120));
document.addEventListener('selectionchange',()=>{if(document.activeElement?.closest?.('.t'))fbarState()});
visualViewport?.addEventListener('resize',fbarPlace);visualViewport?.addEventListener('scroll',fbarPlace);
fbar.addEventListener('touchstart',e=>e.preventDefault(),{passive:false}); // keep focus + selection on touch
fbar.addEventListener('pointerdown',e=>{e.preventDefault();const k=e.target.dataset?.k,a=e.target.dataset?.a;
  const sd=document.activeElement?.closest?.('.s');
  if(a&&sd){const id=sd.dataset.id;
    if(a==='mix'){const c=B().scraps[id];c.r=rand32();paint(sd,id,c);updateDoc(ref(cur),{['scraps.'+id+'.r']:c.r})}
    if(a==='del'){document.activeElement.blur();put(id,{...B().scraps[id],bin:true,g:null});render()}
    return}
  if(!k||!document.activeElement?.closest?.('.t'))return;
  document.execCommand(CMD[k]);fbarState();saveCur&&saveCur()});
addEventListener('pagehide',()=>document.activeElement?.blur?.());
document.addEventListener('visibilitychange',()=>document.hidden&&document.activeElement?.blur?.());
document.fonts?.ready.then(()=>{if(user&&B()&&!dragging)render()});
// Layout: desktop keeps free placement (x,y). Phones lay the same notes out automatically: groups as tidy
// blocks, loose notes flowing in rows, in the desktop's reading order. Phones never store positions.
const mob=()=>innerWidth<=700||(innerHeight<=500&&innerWidth<=1000);
// Groups: notes inside a group are always arranged automatically in centred rows, so the outline hugs them.
// Order inside a group = note.o; a group's spot on the desktop = group.x/y (top-left of its notes).
const rankOf=(b,ids)=>ids.slice().sort((a,c)=>{const A=b.scraps[a],C=b.scraps[c];
  return (A.o??1e9)-(C.o??1e9)||(A.y??1e9)-(C.y??1e9)||(A.x??0)-(C.x??0)||(A.ts||0)-(C.ts||0)});
function members(b){const m={};Object.entries(b.scraps).forEach(([id,s])=>{const g=gOf(b,s);if(g&&cvEl(id))(m[g]??=[]).push(id)});
  for(const g in m)m[g]=rankOf(b,m[g]);return m}
function lay(ids,maxW){
  const G=10,sz=ids.map(id=>{const n=cvEl(id);return[n.offsetWidth,n.offsetHeight]});
  if(maxW==null){const avg=sz.reduce((a,s)=>a+s[0]+G,0)/ids.length,cols=Math.ceil(Math.sqrt(ids.length));
    maxW=Math.min(560,Math.max(...sz.map(s=>s[0]),avg*cols))}
  const rows=[];let row=null;

const at=(id,x,y)=>{const n=cvEl(id);if(n&&!n.classList.contains('drag')){n.style.left=x+'px';n.style.top=y+'px'}};
// desktop: groups and loose notes keep their own spots; anything without a spot yet goes into free space
function desk(b){
  const W=$('#table').clientWidth,M=14,upd={},R=[],m=members(b),Lg={};
  const loose=Object.entries(b.scraps).filter(([id,s])=>s&&!s.bin&&!gOf(b,s)&&cvEl(id));
  loose.forEach(([id,s])=>{if(s.x!=null){const n=cvEl(id);R.push({x:s.x,y:s.y,w:n.offsetWidth,h:n.offsetHeight})}});
  const rect=(g,x,y)=>({x:x-PAD,y:y-PAD-22,w:Lg[g].w+2*PAD,h:Lg[g].h+2*PAD+22});
  const setG=(g,x,y)=>{b.groups[g].x=x;b.groups[g].y=y;upd['groups.'+g+'.x']=x;upd['groups.'+g+'.y']=y};
  const pending=[];

    if(G.x==null){const ps=m[g].map(i=>b.scraps[i]).filter(s=>s.x!=null); // older groups: start where their notes were

  loose.forEach(([id,s])=>{if(s.x!=null)return;const n=cvEl(id),w=n.offsetWidth,h=n.offsetHeight,[x,y]=free(w,h);
    R.push({x,y,w,h});at(id,x,y);b.scraps[id]={...s,x,y};upd['scraps.'+id+'.x']=x;upd['scraps.'+id+'.y']=y});

// phone: everything laid out automatically (groups as centred blocks, loose notes in rows), in desktop reading order
function flow(b){
  const W=$('#table').clientWidth,L=14,G=10,m=members(b),units=[];
  Object.entries(b.scraps).forEach(([id,s])=>{if(s&&!s.bin&&!gOf(b,s)&&cvEl(id))units.push({id,k:[s.y??1e9,s.x??0,s.ts??0]})});
  for(const g in m){const gr=b.groups[g];units.push({g,k:[gr.y??Math.min(...m[g].map(i=>b.scraps[i].y??1e9)),gr.x??0,0]})}
  units.sort((a,c)=>a.k[0]-c.k[0]||a.k[1]-c.k[1]||a.k[2]-c.k[2]);

    const avail=W-2*L-2*PAD,l=lay(m[u.g],avail),x0=L+PAD+Math.max(0,(avail-l.w)/2);y+=26;

let tabsSig='';
function render(){

  const sig=JSON.stringify(sortedBoards().map(x=>[x.id,x.name]))+cur;
  if(sig!==tabsSig){tabsSig=sig;$('#bar').innerHTML='';
    sortedBoards().forEach(x=>{const e=document.createElement('button');e.textContent=x.name;e.className=x.id===cur?'on':'';
      e.onclick=()=>{cur=x.id;localStorage.cur=cur;render()};$('#bar').append(e)});
    const plus=document.createElement('button');plus.textContent='\uFF0B';plus.onclick=()=>{const n=prompt('Board name');n&&newBoard(n)};$('#bar').append(plus)}
  const all=Object.entries(b.scraps||{}).filter(([,s])=>s);
  $('#bn').textContent=all.filter(([,s])=>s.bin).length;
  $('#bin').classList.toggle('on',showBin);
  const cv=$('#canvas'),shown=new Map(all.filter(([,s])=>!!s.bin===showBin));
  // update notes in place (never rebuild): a note under your finger/mouse or being typed in stays put
  cv.querySelectorAll('.s').forEach(n=>{if(!shown.has(n.dataset.id))n.remove()});
  shown.forEach((s,id)=>{let d=cvEl(id);if(!d){d=el(id);cv.append(d)}upd(d,id,s)});
  if(!showBin)(mob()?flow:desk)(b);
  groups(b,cv);
  const bot=Math.max(0,...[...cv.children].map(n=>n.offsetTop+n.offsetHeight));
  cv.style.height=Math.max($('#table').clientHeight,bot+(mob()?120:260))+'px';
}
function upd(d,id,s){
  const dr=d.classList.contains('drag');d.className='s'+(s.big?' big':'')+(dr?' drag':'');
  if(!mob()&&!dr&&s.x!=null){d.style.left=s.x+'px';d.style.top=s.y+'px'}
  d.style.transform=`rotate(${id.charCodeAt(0)%5-2}deg)`;paint(d,id,s);
  const t=d.firstChild;t.className='t'+(s.b?' b':'')+(s.i?' i':'')+(s.u?' u':'');t.contentEditable=!s.bin;
  if(t!==document.activeElement){const h=clean(hOf(s));if(t.innerHTML!==h)t.innerHTML=h}
  let x=d.querySelector('.x');
  if(s.bin&&!x){x=document.createElement('span');x.className='x';x.textContent='\u21BA Restore';
    x.onclick=e=>{e.stopPropagation();put(id,{...B().scraps[id],bin:false});render()};d.append(x)}
  else if(!s.bin&&x)x.remove();

// bounding box (canvas coords) of a group's notes, optionally excluding one
function gbox(gid,ex){
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  Object.entries(B().scraps).forEach(([id,s])=>{if(id===ex||!s||s.g!==gid||s.bin)return;const n=cvEl(id);if(!n)return;
    x1=Math.min(x1,n.offsetLeft);y1=Math.min(y1,n.offsetTop);x2=Math.max(x2,n.offsetLeft+n.offsetWidth);y2=Math.max(y2,n.offsetTop+n.offsetHeight)});

}
// pointer drag tracked on the window, so it can never get stuck if the page updates mid-drag
function drag(e,{move,end,tap,cap}){

  const mv=ev=>{if(ev.pointerId!==pid)return;dx=ev.clientX-sx;dy=ev.clientY-sy;if(!moved&&Math.hypot(dx,dy)<6)return;
    if(!moved){moved=true;dragging=true;cap&&cap()}ev.preventDefault();move(dx,dy)};
  const up=ev=>{if(ev.pointerId!==pid)return;removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
    if(!moved){if(ev.type==='pointerup')tap&&tap();return}
    if(ev.type==='pointerup'){dx=ev.clientX-sx;dy=ev.clientY-sy}
    dragging=false;try{end(dx,dy)}catch(err){console.error(err);render()}};
  addEventListener('pointermove',mv,{passive:false});addEventListener('pointerup',up);addEventListener('pointercancel',up);

function groups(b,cv){
  const keep=document.activeElement?.closest?.('.grp'),live={};
  if(!showBin)Object.entries(b.scraps).forEach(([id,s])=>{const g=gOf(b,s);if(g&&cvEl(id))(live[g]??=[]).push(id)});
  cv.querySelectorAll('.grp').forEach(n=>{if(n!==keep||!live[n.dataset.gid])n.remove()});
  Object.keys(live).forEach(gid=>{let g=keep&&keep.dataset.gid===gid&&keep.isConnected?keep:null;if(!g){g=gEl(gid);cv.append(g)}geo(g,gid)});
}
function geo(g,gid){
  const bb=gbox(gid);if(!bb)return;const W=bb.x2-bb.x1+2*PAD,H=bb.y2-bb.y1+2*PAD,sd=scribble(W,H,hash(gid));
  g.style.cssText=`left:${bb.x1-PAD}px;top:${bb.y1-PAD}px;width:${W}px;height:${H}px`;
  g.querySelector('svg')?.remove();
  g.insertAdjacentHTML('afterbegin',`<svg class="scr" width="${W}" height="${H}"><path class="f" d="${sd}Z"/><path class="o" d="${sd}"/></svg>`);
  const nm=g.querySelector('.gn');if(nm!==document.activeElement)nm.textContent=B().groups?.[gid]?.name||'';
}
function gEl(gid){
  const g=document.createElement('div');g.className='grp';g.dataset.gid=gid;
  const nm=document.createElement('div');nm.className='gn';nm.contentEditable=true;nm.dataset.ph='name this';
  const saveName=()=>{const v=nm.textContent.trim(),gr=B()?.groups?.[gid];if(gr&&v!==(gr.name||'')){gr.name=v;updateDoc(ref(cur),{['groups.'+gid+'.name']:v})}};
  let nt;nm.oninput=()=>{clearTimeout(nt);nt=setTimeout(saveName,500)};
  nm.onblur=()=>{clearTimeout(nt);saveName();if(!dragging)render()};
  nm.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();nm.blur()}};
  g.append(nm);
  g.onpointerdown=e=>{
    if(e.target===nm&&document.activeElement===nm)return;
    if(mob())return; // phone: groups are laid out automatically; tap the name to rename
    const b=B(),ids=Object.keys(b.scraps).filter(i=>gOf(b,b.scraps[i])===gid&&cvEl(i));
    const ox=Object.fromEntries(ids.map(i=>[i,[cvEl(i).offsetLeft,cvEl(i).offsetTop]])),L=g.offsetLeft,T=g.offsetTop;
    if(e.pointerType==='mouse')e.preventDefault();
    drag(e,{cap:()=>nm.blur(),tap:()=>e.target===nm&&nm.focus(),
      move:(dx,dy)=>{g.style.left=L+dx+'px';g.style.top=T+dy+'px';ids.forEach(i=>{const n=cvEl(i);if(n){n.style.left=ox[i][0]+dx+'px';n.style.top=ox[i][1]+dy+'px'}})},
      end:(dx,dy)=>{const G=B().groups?.[gid];if(!G)return render();
        const nx=Math.round(Math.max(PAD,(G.x??0)+dx)),ny=Math.round(Math.max(PAD+22,(G.y??0)+dy));G.x=nx;G.y=ny;
        updateDoc(ref(cur),{['groups.'+gid+'.x']:nx,['groups.'+gid+'.y']:ny});render()}});

function el(id){
  const d=document.createElement('div');d.dataset.id=id;
  const t=document.createElement('div');d.append(t);
  // saves while typing/formatting (debounced) so closing the tab loses nothing; one undo step per edit session
  let tt,orig=null;
  function save(){clearTimeout(tt);const c=B().scraps[id];if(!c)return;const r=ser(t);c.t=r.t;c.h=r.h;
    updateDoc(ref(cur),{['scraps.'+id+'.t']:r.t,['scraps.'+id+'.h']:r.h,['scraps.'+id+'.ts']:Date.now()})}
  t.onfocus=()=>{orig=B().scraps[id];saveCur=save};
  t.onpaste=e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))};
  t.oninput=()=>{clearTimeout(tt);tt=setTimeout(save,500)};
  t.onblur=()=>{clearTimeout(tt);const c=B().scraps[id];
    if(c&&orig){const r=ser(t);
      if(!r.t.trim()){put(id,null)} // a note left empty is removed (undo brings it back)
      else if(r.h!==clean(hOf(orig))){history.push({b:cur,ops:[{id,prev:orig}]});put(id,{...c,t:r.t,h:r.h},false)}}
    orig=null;if(!dragging)render()};
  d.onpointerdown=e=>{
    if(e.target===t&&document.activeElement===t)return;
    if(e.target.closest('.x'))return;
    if(e.pointerType==='mouse')e.preventDefault();
    const ox=d.offsetLeft,oy=d.offsetTop;
    drag(e,{cap:()=>{d.classList.add('drag');t.blur()},tap:()=>t.focus(),
      move:(dx,dy)=>{d.style.left=ox+dx+'px';d.style.top=oy+dy+'px';
        const h=hit(d);document.querySelectorAll('.tgt').forEach(n=>n.classList.remove('tgt'));h&&h.classList.add('tgt')},
      end:(dx,dy)=>{d.classList.remove('drag');document.querySelectorAll('.tgt').forEach(n=>n.classList.remove('tgt'));drop(id,d,dx,dy,ox,oy)}});

const noPos=o=>{const c={...o};delete c.x;delete c.y;return c};
// a group's notes in order, with `id` slotted in nearest to the drop point
function insertAt(b,gid,id,cx,cy){
  const sib=(members(b)[gid]||[]).filter(i=>i!==id);let idx=sib.length,best=1e18;
  sib.forEach((i,k)=>{const n=cvEl(i),mx=n.offsetLeft+n.offsetWidth/2,my=n.offsetTop+n.offsetHeight/2,dd=Math.hypot(cx-mx,(cy-my)*2);
    if(dd<best){best=dd;idx=cx<mx?k:k+1}});
  sib.splice(idx,0,id);return sib;
}
function drop(id,d,dx,dy,ox,oy){
  const b=B(),s=b.scraps[id];if(!s)return render();
  const M=mob(),nx=Math.max(0,ox+dx),ny=Math.max(0,oy+dy),cx=nx+d.offsetWidth/2,cy=ny+d.offsetHeight/2,h=s.bin?null:hit(d);
  let g=null;
  if(!s.bin){if(h&&b.scraps[h.dataset.id])g=gOf(b,b.scraps[h.dataset.id])||'new';
    else Object.keys(b.groups||{}).forEach(gid=>{const bb=gbox(gid,id);if(bb&&cx>bb.x1-PAD&&cx<bb.x2+PAD&&cy>bb.y1-PAD&&cy<bb.y2+PAD)g=gid})}
  if(g==='new'){ // dropped onto a loose note: start a group where that note is
    const tid=h.dataset.id,t=b.scraps[tid],gid=uid8(),gd={name:''};
    if(t.x!=null){gd.x=Math.round(t.x);gd.y=Math.round(t.y)}
    b.groups??={};b.groups[gid]={...gd};updateDoc(ref(cur),{['groups.'+gid]:gd});
    const order=cx<h.offsetLeft+h.offsetWidth/2?[id,tid]:[tid,id];
    commit(order.map((i,k)=>[i,{...b.scraps[i],g:gid,o:k}]));
  }else if(g)commit(insertAt(b,g,id,cx,cy).map((i,k)=>[i,{...b.scraps[i],g,o:k}])); // join or re-order
  else if(M){if(gOf(b,s))commit([[id,noPos({...s,g:null})]])} // phone: dragged out of its group
  else commit([[id,{...s,x:Math.round(nx),y:Math.round(ny),g:null}]]);

}
function hit(d){const r=d.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  return [...document.querySelectorAll('.s')].find(n=>n!==d&&(rr=>cx>rr.left&&cx<rr.right&&cy>rr.top&&cy<rr.bottom)(n.getBoundingClientRect()))}
